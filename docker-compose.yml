version: "3.9"

services:
  kms-service:
    build: ./kms-service
    container_name: kms-service
    environment:
      - MASTER_KEY_PASSPHRASE=dev-master-pass
      - KMS_DATABASE_URL=postgresql+psycopg2://kms:kms@kms-db:5432/kms_poc_kms
    networks:
      - backend
    depends_on:
      kms-db:
        condition: service_healthy

  data-service:
    build: ./data-service
    container_name: data-service
    environment:
      - KMS_BASE_URL=http://kms-service:8000
      - DATABASE_URL=postgresql+psycopg2://kms:kms@data-service-db:5432/kms_poc_data
    depends_on:
      kms-service:
        condition: service_started
      data-service-db:
        condition: service_healthy
    networks:
      - backend

  data-service-db:
    image: postgres:16
    container_name: data-service-db
    environment:
      - POSTGRES_USER=kms
      - POSTGRES_PASSWORD=kms
      - POSTGRES_DB=kms_poc_data
    volumes:
      - db_data_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kms -d kms_poc_data"]
      interval: 5s
      timeout: 5s
      retries: 5

  kms-db:
    image: postgres:16
    container_name: kms-kms-db
    environment:
      - POSTGRES_USER=kms
      - POSTGRES_PASSWORD=kms
      - POSTGRES_DB=kms_poc_kms
    volumes:
      - db_kms_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kms -d kms_poc_kms"]
      interval: 5s
      timeout: 5s
      retries: 5

  ui:
    build: ./ui
    container_name: kms-ui
    depends_on:
      - kms-service
      - data-service
    networks:
      - backend

  nginx-proxy:
    image: nginx:alpine
    container_name: kms-proxy
    depends_on:
      - ui
      - kms-service
      - data-service
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - backend

networks:
  backend:

volumes:
  db_data_data:
  db_kms_data:
